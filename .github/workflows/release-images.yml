name: release-images

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test-build-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: kaxi_erp
          POSTGRES_USER: kaxi_app
          POSTGRES_PASSWORD: kaxi_ci_only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U kaxi_app -d kaxi_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      KAXI_DB_PASSWORD: kaxi_ci_only
      KAXI_SECRET_KEY: ci-only-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          ruff check backend
          python backend/manage.py check
          python backend/manage.py migrate --noinput
          pytest

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kaxierp:backend-${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kaxierp:backend-sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kaxierp:backend-latest
          sbom: true
          provenance: mode=max

      - name: Build and publish Frontend
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kaxierp:frontend-${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kaxierp:frontend-sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kaxierp:frontend-latest
          sbom: true
          provenance: mode=max

      - name: Create immutable deployment manifest
        shell: bash
        run: |
          printf '%s\n' \
            "SOURCE_COMMIT=${GITHUB_SHA}" \
            "KAXI_BACKEND_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kaxierp@${{ steps.backend.outputs.digest }}" \
            "KAXI_WEB_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kaxierp@${{ steps.web.outputs.digest }}" \
            "KAXI_POSTGRES_IMAGE=docker.io/library/postgres@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449" \
            "KAXI_REDIS_IMAGE=docker.io/library/redis@sha256:ddd16a9b1575a774c7e62956be8daa1de5b32cfb5c25b7a216aefed8e0919f9b" \
            "KAXI_MINIO_IMAGE=docker.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e" \
            "KAXI_MINIO_CLIENT_IMAGE=docker.io/minio/mc@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3" \
            > release-images.env

          sha256sum release-images.env > release-images.env.sha256

          bundle="kaxi-erp-${GITHUB_REF_NAME}-deploy"
          mkdir -p \
            "${bundle}/infrastructure/postgres/init" \
            "${bundle}/scripts" \
            "${bundle}/docs/baseline" \
            "${bundle}/docs/deployment" \
            "${bundle}/docs/development"
          cp README.md compose.deploy.yaml compose.fnos.yaml .env.deploy.example release-images.env release-images.env.sha256 "${bundle}/"
          cp docs/baseline/[0-9][0-9]_KAXI_ERP_*.md "${bundle}/docs/baseline/"
          cp infrastructure/postgres/init/001-schema.sql "${bundle}/infrastructure/postgres/init/"
          cp scripts/*.sh scripts/*.ps1 "${bundle}/scripts/"
          cp docs/README.md "${bundle}/docs/"
          cp docs/deployment/*.md "${bundle}/docs/deployment/"
          cp docs/development/README.md "${bundle}/docs/development/"
          zip -rq "${bundle}.zip" "${bundle}"
          sha256sum "${bundle}.zip" > "${bundle}.zip.sha256"
          cp "${bundle}.zip" kaxi-erp-deploy.zip
          sha256sum kaxi-erp-deploy.zip > kaxi-erp-deploy.zip.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaxi-${{ github.ref_name }}-deployment-manifest
          path: |
            release-images.env
            release-images.env.sha256
            kaxi-erp-${{ github.ref_name }}-deploy.zip
            kaxi-erp-${{ github.ref_name }}-deploy.zip.sha256
            kaxi-erp-deploy.zip
            kaxi-erp-deploy.zip.sha256
          if-no-files-found: error

      - name: Publish permanent GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            "kaxi-erp-${GITHUB_REF_NAME}-deploy.zip"
            "kaxi-erp-${GITHUB_REF_NAME}-deploy.zip.sha256"
            kaxi-erp-deploy.zip
            kaxi-erp-deploy.zip.sha256
            release-images.env
            release-images.env.sha256
          )

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "KAXI ERP ${GITHUB_REF_NAME}"
          fi
