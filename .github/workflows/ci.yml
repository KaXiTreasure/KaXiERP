name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: kaxi_erp
          POSTGRES_USER: kaxi_app
          POSTGRES_PASSWORD: kaxi_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaxi_app -d kaxi_erp"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KAXI_DB_PASSWORD: kaxi_ci_only
      KAXI_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.13"}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check backend
      - run: python backend/manage.py check --settings=config.settings.test
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "24"}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
