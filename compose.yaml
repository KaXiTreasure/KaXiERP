services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: kaxi_erp
      POSTGRES_USER: kaxi_app
      POSTGRES_PASSWORD: kaxi_local_only
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaxi_app -d kaxi_erp"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.2.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: kaxi_local
      MINIO_ROOT_PASSWORD: kaxi_local_only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
